laravel: '@testbench'

providers:
  - Sunrice\Admin\AdminServiceProvider
  - Sunrice\Cms\CmsServiceProvider
  - Spatie\Honeypot\HoneypotServiceProvider
  - Spatie\OneTimePasswords\OneTimePasswordsServiceProvider
  - Laravel\Socialite\SocialiteServiceProvider
  - Sunrice\Commerce\CommerceServiceProvider
  - Workbench\App\Providers\AdminPanelProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - storage-link:
        --force: true
    - create-sqlite-db
    - db-wipe
    - migrate-fresh:
        --seed: true
        --seeder: Workbench\Database\Seeders\DatabaseSeeder
  assets:
    - sunrice-cms-assets
    - commerce-assets

# One KEY=value per line, as in a .env file.
env:
  - APP_NAME=KAIN
  - 'AUTH_MODEL="Workbench\\App\\Models\\User"'
  - DB_CONNECTION=sqlite
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  - APP_URL=http://127.0.0.1:8000
  - SUNRICE_LOCALES=id,en
  # The demo's users sign in with simple passwords: don't ask Have I Been Pwned about them.
  - SUNRICE_PASSWORD_UNCOMPROMISED=false
